- title: Academic Interests
  type: list
  contents:
    - |
      <b>Research:</b> High-PT spectroscopy using Au-lined spectroscopic cells (UV–vis and OPO/OPA IR); pilot fibre-loop cavity ring-down spectroscopy, diamond-anvil coupling; metals and clusters in ore vapors; G16/CFOUR and CPMD/CP2K.
    - |
      <b>Undergraduate Teaching:</b> <b>1</b>. <a href="https://webapp.science.hku.hk/sr4/servlet/enquiry?Type=Course&course_code=EASC2401"><b>EASC2401 "Fluid/Solid Interactions in Earth Processes"</b></a> Thermodynamics and equilibrium, phase diagrams, mineral–solution interfaces, energy exchange, kinetics and isotope fractionation, and fluid flow in Earth processes. Core course for Geology and Earth System Science majors. <b>2</b>. <a href="https://commoncore.hku.hk/ccgl9033/"><b>CCGL9033 "Weapons of Mass Destruction - Science, Proliferation and Terrorism"</b></a> Nuclear, chemical and biological weapons—their development and use in conflict; proliferation networks and non-state actors; nuclear-test environmental effects; non-proliferation treaties and monitoring; WMD terrorism; and the debate over complete disarmament. <b>3</b>. <a href="https://commoncore.hku.hk/ccst9018/"><b>CCST9018 "Origin and Evolution of Life"</b></a> Astrobiology on the origin, evolution and diversification of life: early Earth chemical evolution, liquid water and interfaces, exoplanets and habitable zones, alternative biochemistries, and the societal implications of finding extraterrestrial life.
    - |
      <b>Graduate Teaching:</b> <b>1</b>. <a href="https://www.earthsciences.hku.hk/education/postgraduate_students/research_postgraduates/coursework_requirement/"><b>EASC6010 "Nanogeoscience"</b></a> Nanomaterial properties and nano-scale processes in solids, fluids/vapors and across reactive interfaces, with applications to Earth and environmental science. Topics include size-dependent thermodynamics and melting, early Earth and origins of life, and size-sensitive spectroscopies (AFM, nanocalorimetry, mass spectrometry).
